<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Abstract playbook-inspired line art (route lines, grid, arrows, dots) -
       deliberately NOT literal sports icons (no helmet/football/whistle/
       crown), per the resolved rebrand-vs-visual-design conflict: this is a
       subtle background texture, not brand imagery. -->
  <g fill="none" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint route grid -->
    <path d="M20 20 h320" stroke-opacity="0.35" />
    <path d="M20 130 h320" stroke-opacity="0.35" />
    <path d="M20 240 h320" stroke-opacity="0.35" />
    <path d="M20 350 h320" stroke-opacity="0.35" />

    <!-- diagonal route with arrowhead -->
    <path d="M40 60 L120 140" />
    <path d="M120 140 l-16 -2 M120 140 l-2 -16" />

    <!-- L-shaped route -->
    <path d="M200 40 v50 h60" />
    <path d="M260 90 l-14 -6 M260 90 l-6 14" />

    <!-- route endpoint dots -->
    <circle cx="40" cy="60" r="4" />
    <circle cx="200" cy="40" r="4" />

    <!-- crossing route -->
    <path d="M60 200 L160 300" />
    <path d="M160 300 l-16 -2 M160 300 l-2 -16" />

    <!-- short hash/grid ticks -->
    <path d="M280 170 v20 M300 170 v20 M320 170 v20" stroke-opacity="0.4" />

    <!-- circular "read" marker -->
    <circle cx="290" cy="270" r="14" stroke-opacity="0.5" />
    <circle cx="290" cy="270" r="3" fill="#C9A24B" stroke="none" />

    <!-- long diagonal go-route -->
    <path d="M40 320 L140 260" stroke-opacity="0.5" />

    <!-- small square (formation marker) -->
    <rect x="230" y="220" width="18" height="18" stroke-opacity="0.45" />
  </g>
</svg>
