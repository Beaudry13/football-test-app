services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: football_quiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d football_quiz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/football_quiz
      TEST_DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/football_quiz_test
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --debug

volumes:
  postgres_data:
  uploads_data:
